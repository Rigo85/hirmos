services:
  postgres16:
    image: postgres:16-alpine
    container_name: hirmos-postgres16-test
    environment:
      POSTGRES_DB: hirmos
      POSTGRES_USER: hirmos_app
      POSTGRES_PASSWORD: hirmos-pg16-test-only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirmos_app -d hirmos"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
