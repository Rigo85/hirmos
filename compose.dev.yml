services:
  postgres:
    image: postgres:17-alpine
    container_name: hirmos-postgres-dev
    environment:
      POSTGRES_DB: hirmos
      POSTGRES_USER: hirmos_app
      POSTGRES_PASSWORD: hirmos-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirmos_app -d hirmos"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - hirmos-postgres-dev:/var/lib/postgresql/data

volumes:
  hirmos-postgres-dev:
